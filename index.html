<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>植物大战僵尸 - 进阶版</title>
  <style>
    :root {
      --tile-w: 100px;
      --tile-h: 90px;
      --rows: 5;
      --cols: 9;
      --field-w: calc(var(--cols) * var(--tile-w));
      --field-h: calc(var(--rows) * var(--tile-h));
      --bar: #0f1c22;
      --bar-2: #13252d;
      --text: #eaf2f7;
      --accent: #f2c14e;
      --accent-2: #ff7d6b;
      --green-1: #86d194;
      --green-2: #5fbf69;
      --grid-line: rgba(255,255,255,0.12);
      --shadow: 0 12px 30px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: radial-gradient(1200px 600px at 50% -200px, #17313a, #0c2128); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }

    .app { max-width: calc(var(--field-w) + 32px); margin: 12px auto 28px; padding: 0 16px; }

    .topbar { position: sticky; top: 8px; z-index: 20; background: linear-gradient(180deg, var(--bar), var(--bar-2)); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    .sun-box { display: inline-flex; align-items: center; gap: 8px; background: rgba(242,193,78,0.12); color: var(--accent); border: 1px solid rgba(242,193,78,0.35); padding: 6px 10px; border-radius: 10px; font-weight: 800; letter-spacing: 0.3px; }

    .seedbar { display: flex; gap: 8px; flex-wrap: wrap; }

    .card { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); min-width: 124px; cursor: pointer; user-select: none; transition: transform 0.06s ease, background 0.2s ease, opacity 0.2s ease, filter 0.2s ease; }
    .card:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
    .card.active { outline: 2px solid var(--accent); }
    .card .emoji { font-size: 20px; }
    .card .title { font-weight: 700; }
    .card .cost { color: var(--accent); font-weight: 800; }
    .card .cd { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.65)); border-radius: 10px; display: none; }
    .card.cooling .cd { display: block; }
    .card .cd::after { content: attr(data-left); position: absolute; bottom: 4px; right: 8px; color: #ffd479; font-size: 12px; }
    .card .badge { position: absolute; top: 3px; right: 6px; color: var(--accent-2); font-weight: 800; font-size: 11px; display: none; }
    .card.disabled { opacity: 0.55; filter: grayscale(0.2); }
    .card.disabled .badge { display: block; }

    .right-tools { display:flex; align-items:center; gap: 8px; }
    .btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer; user-select: none; transition: transform 0.06s ease, background 0.2s ease; }
    .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.1); }
    .btn.active { outline: 2px solid var(--accent); background: rgba(242, 193, 78, 0.13); }

    .progress { position: relative; height: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; min-width: 220px; }
    .progress > .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #52d17a, #33b1ff); box-shadow: inset 0 0 10px rgba(255,255,255,0.25); }

    .board-outer { display:flex; justify-content:center; margin-top:12px; }
    .board-scale { transform-origin: top center; will-change: transform; }

    .field { position: relative; width: var(--field-w); height: var(--field-h); border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, var(--green-1), var(--green-2)); border: 2px solid rgba(255,255,255,0.12); box-shadow: var(--shadow); }
    .row-stripe { position: absolute; left: 0; width: 100%; height: var(--tile-h); }
    .row-stripe:nth-child(odd) { background: rgba(0,0,0,0.05); }
    .grid { position: absolute; inset: 0; pointer-events:none; background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); background-size: var(--tile-w) var(--tile-h), var(--tile-w) var(--tile-h); }
    .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), var(--tile-w)); grid-template-rows: repeat(var(--rows), var(--tile-h)); z-index: 2; }
    .tile { pointer-events: auto; }
    .tile:hover { outline: 2px dashed rgba(255,255,255,0.25); outline-offset: -2px; }

    .entities { position: absolute; inset: 0; pointer-events: none; }
    .plant, .zombie, .pea, .snowpea, .firepea, .boom, .rowfire, .sun-token, .mower, .ghost { position: absolute; will-change: transform; }

    .plant { width: calc(var(--tile-w) - 10px); height: calc(var(--tile-h) - 10px); transform: translate(5px, 5px); border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.25); border: 2px solid rgba(0,0,0,0.1); color: #102015; }
    .plant.peashooter { background: #64c86a; }
    .plant.sunflower { background: #f2c14e; color: #5a3d00; }
    .plant.wallnut { background: #b08968; }
    .plant.tallnut { background: #927052; }
    .plant.snowpea { background: #7fd3ff; color: #053047; }
    .plant.repeater { background: #5abf84; }
    .plant.cherry { background: #ff6b6b; color: #380606; }
    .plant.potatomine { background: #9a6c43; }
    .plant.spikeweed { background: #546b2f; color: #cfe28a; }
    .plant.torchwood { background: #e7963c; color: #2a1700; }
    .plant.squash { background: #8fd36a; }
    .plant.chomper { background: #9b6bd6; color: #220b3f; }
    .plant.jalapeno { background: #ff4b4b; color: #3d0000; }

    .ghost { width: calc(var(--tile-w) - 10px); height: calc(var(--tile-h) - 10px); transform: translate(5px, 5px); border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #102015; background: rgba(255,255,255,0.45); border: 2px dashed rgba(255,255,255,0.8); pointer-events:none; opacity: 0; transition: opacity .15s ease, filter .15s ease, border-color .15s ease; }
    .ghost.show { opacity: 1; }
    .ghost.valid { border-color: rgba(82,209,122,0.9); box-shadow: 0 0 0 2px rgba(82,209,122,0.35) inset; }
    .ghost.invalid { filter: grayscale(1) brightness(0.85); border-color: rgba(255,109,102,0.9); box-shadow: 0 0 0 2px rgba(255,109,102,0.3) inset; }

    .zombie { width: 62px; height: 80px; background: #9aa9aa; border: 2px solid #6f7e7e; border-radius: 10px; display: grid; place-items: center; font-size: 20px; color: #202b2b; font-weight: 800; }
    .zombie.cone { background: linear-gradient(#9aa9aa, #8d9a9a); border-color: #7c8b8b; }
    .zombie.bucket { background: linear-gradient(#9aa9aa, #7f8f9f); border-color: #6d7c8a; }
    .zombie.imp { width: 50px; height: 68px; background: #a6b0b0; }
    .zombie.flag { background: #a4b8b8; }
    .zombie.pole { background: #a7b6b6; }
    .zombie.screen { background: linear-gradient(#8fa3a3, #7f9198); box-shadow: inset 0 0 0 4px rgba(180, 210, 220, 0.45); }
    .zombie.football { background: #6e7e88; border-color: #4d5962; }
    .zombie.slowed { filter: hue-rotate(170deg) brightness(0.9); }
    .zombie.noshield { box-shadow: none !important; }

    .pea, .snowpea, .firepea { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2f993a; }
    .pea { background: #51d451; box-shadow: 0 0 10px rgba(81,212,81,0.7); }
    .snowpea { background: #a5ecff; border-color: #3b8fa3; box-shadow: 0 0 10px rgba(105,225,255,0.7); }
    .firepea { background: #ff9933; border-color: #b34d00; box-shadow: 0 0 12px rgba(255,153,51,0.85); }

    .boom { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255,210,120,0.95) 0%, rgba(255,120,80,0.85) 40%, rgba(255,80,80,0.0) 60%); pointer-events: none; mix-blend-mode: screen; }
    .rowfire { position:absolute; left:0; width: 100%; height: 70px; background: linear-gradient(90deg, rgba(255,80,50,0.0) 0%, rgba(255,80,50,0.8) 20%, rgba(255,120,50,0.6) 50%, rgba(255,80,50,0.8) 80%, rgba(255,80,50,0.0) 100%); filter: blur(1px); pointer-events:none; }

    .sun-token { width: 42px; height: 42px; border-radius: 50%; background: #ffd166; border: 2px solid #caa240; display: grid; place-items: center; color: #6b4b00; font-weight: 800; font-size: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.25); cursor: pointer; pointer-events: auto; z-index: 5; }

    .mower { width: 62px; height: 44px; background: linear-gradient(#e9f1f5,#cbd9df); border: 2px solid #7f95a0; border-radius: 8px; display: grid; place-items: center; font-size: 20px; color: #21323a; }

    .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .overlay .panel { pointer-events: auto; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 18px 22px; text-align: center; backdrop-filter: blur(4px); }
    .overlay h2 { margin: 0 0 8px; }

    .muted { opacity: 0.75; }
    .small { font-size: 12px; opacity: 0.85; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="row" style="margin-bottom:8px">
        <div class="sun-box">☀️ <span id="sunCount">150</span></div>
        <div class="right-tools">
          <div class="btn" id="shovelBtn">🧹 铲子</div>
          <div class="btn" id="pauseBtn">⏸️ 暂停</div>
          <div class="btn" id="restartBtn">重新开始</div>
        </div>
      </div>
      <div class="row">
        <div class="seedbar" id="seedBar"></div>
        <div class="progress" title="关卡进度">
          <div class="bar" id="waveProgress"></div>
        </div>
      </div>
    </div>

    <div class="board-outer">
      <div id="boardScale" class="board-scale">
        <div class="field" id="field">
          <div id="stripes"></div>
          <div class="grid"></div>
          <div class="tiles" id="tiles"></div>
          <div class="entities" id="entities"></div>
          <div class="overlay" id="overlay" hidden>
            <div class="panel">
              <h2 id="overlayTitle">游戏结束</h2>
              <div class="muted" id="overlayDesc">僵尸冲破了你的防线…</div>
              <div style="height: 12px"></div>
              <div class="btn" id="overlayRestart">再来一局</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="small muted">提示：选卡放置植物（有冷却与阳光费用）。卡片灰色=阳光不足，黑遮罩=冷却中。鼠标移到格子会显示放置预览。</div>
  </div>

  <script>
    // ---------------- 配置 ----------------
    const ROWS = 5; const COLS = 9; const TILE_W = 100; const TILE_H = 90;

    const PLANTS = {
      peashooter: { id:'peashooter', name:'豌豆射手', emoji:'🌿', className:'peashooter', cost:100, hp: 300, fireInterval: 1500, cooldownMs: 5000 },
      sunflower: { id:'sunflower', name:'向日葵', emoji:'🌻', className:'sunflower', cost:50, hp: 250, sunInterval: 9000, cooldownMs: 5000 },
      wallnut: { id:'wallnut', name:'坚果墙', emoji:'🪵', className:'wallnut', cost:50, hp: 1600, cooldownMs: 12000 },
      tallnut: { id:'tallnut', name:'高坚果', emoji:'🪵', className:'tallnut', cost:125, hp: 3000, cooldownMs: 20000, blocksVault:true },
      snowpea: { id:'snowpea', name:'寒冰射手', emoji:'❄️', className:'snowpea', cost:175, hp: 300, fireInterval: 1750, cooldownMs: 9000 },
      repeater: { id:'repeater', name:'双发射手', emoji:'🌱', className:'repeater', cost:200, hp: 300, fireInterval: 1600, cooldownMs: 10000 },
      torchwood: { id:'torchwood', name:'火炬树桩', emoji:'🔥', className:'torchwood', cost:175, hp: 500, cooldownMs: 15000 },
      squash: { id:'squash', name:'窝瓜', emoji:'🎃', className:'squash', cost:50, hp: 9999, cooldownMs: 15000, reactRange: 120, damage: 9999 },
      chomper: { id:'chomper', name:'食人花', emoji:'🪻', className:'chomper', cost:150, hp: 300, cooldownMs: 20000, chewMs: 4200, range: 80 },
      cherry: { id:'cherry', name:'樱桃炸弹', emoji:'🍒', className:'cherry', cost:150, hp: 1, cooldownMs: 20000, armedDelay: 700, radius: 120, damage: 9999 },
      jalapeno: { id:'jalapeno', name:'火辣椒', emoji:'🌶️', className:'jalapeno', cost:125, hp:1, cooldownMs: 22000, delay: 400, damage: 9999 },
      potatomine: { id:'potatomine', name:'土豆地雷', emoji:'🥔', className:'potatomine', cost:25, hp: 1, cooldownMs: 12000, armTime: 10000, radius: 80, damage: 9999 },
      spikeweed: { id:'spikeweed', name:'地刺', emoji:'🪨', className:'spikeweed', cost:100, hp: 300, cooldownMs: 9000, dps: 90 },
    };

    const ZOMBIES = {
      normal: { type:'normal', emoji:'🧟', hp: 400, speed: 22, dps: 18 },
      flag: { type:'flag', emoji:'🚩', hp: 320, speed: 22, dps: 18 },
      cone: { type:'cone', emoji:'🧟‍♂️', hp: 800, speed: 22, dps: 18 },
      bucket: { type:'bucket', emoji:'🪣', hp: 1400, speed: 22, dps: 18 },
      screen: { type:'screen', emoji:'🧟', hp: 550, shieldHp: 350, speed: 20, dps: 18 },
      pole: { type:'pole', emoji:'🤸', hp: 500, speed: 36, dps: 18 },
      football: { type:'football', emoji:'🏈', hp: 1200, speed: 36, dps: 22 },
      imp: { type:'imp', emoji:'🧟‍♂️', hp: 250, speed: 38, dps: 12 },
    };

    const PEA = { speed: 220, damage: 80 };
    const SNOWPEA = { speed: 220, damage: 60, slowMs: 4000, slowFactor: 0.5 };
    const FIREPEA = { speed: 220, damage: 160 };

    const LEVEL = { duration: 140000, skySunEvery: 6000, bigWaveAt: 0.9 };

    // ---------------- 状态 ----------------
    let sun = 150; let running = true; let paused = false; let lastTs = performance.now();
    const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

    const plants = new Set();
    const zombies = new Set();
    const projectiles = new Set();
    const suns = new Set();
    const mowers = new Set();

    let waveStartAt = 0; let skySunHandle = null; let spawnHandle = null; let bigWaveSpawned = false;

    const cardCooldown = {}; // plantId -> nextUsableTs

    // ---------------- DOM ----------------
    const sunCountEl = document.getElementById('sunCount');
    const tilesEl = document.getElementById('tiles');
    const entitiesEl = document.getElementById('entities');
    const stripesEl = document.getElementById('stripes');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlayTitle');
    const overlayDescEl = document.getElementById('overlayDesc');
    const waveProgressEl = document.getElementById('waveProgress');
    const boardScaleEl = document.getElementById('boardScale');
    const fieldEl = document.getElementById('field');

    let selectedTool = { type:'plant', value:'peashooter' };
    let hoverCell = null; // {row, col}
    let ghostEl = null;

    function $all(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }

    function updateSunUI(){ sunCountEl.textContent = sun; updateCardsUI(); updateGhostValidity(); }

    function addStripeRows(){
      stripesEl.innerHTML = '';
      for (let r=0;r<ROWS;r++){
        const d=document.createElement('div'); d.className='row-stripe'; d.style.top = `${r*TILE_H}px`; d.style.height = `${TILE_H}px`; stripesEl.appendChild(d);
      }
    }

    function buildTiles(){
      tilesEl.innerHTML='';
      for (let r=0;r<ROWS;r++){
        for (let c=0;c<COLS;c++){
          const t=document.createElement('div'); t.className='tile'; t.dataset.row=r; t.dataset.col=c; t.addEventListener('click', onTileClick); t.addEventListener('mouseenter', onTileEnter); t.addEventListener('mouseleave', onTileLeave); tilesEl.appendChild(t);
        }
      }
    }

    function buildMowers(){
      for (let r=0;r<ROWS;r++){
        const mower = { id:`m_${r}`, row:r, x:-20, active:false, el:null };
        mowers.add(mower);
        const el=document.createElement('div'); el.className='mower'; el.style.top = `${r*TILE_H + TILE_H - 48}px`; el.style.left = `${mower.x}px`; el.textContent='🛞'; entitiesEl.appendChild(el); mower.el=el;
      }
    }

    function buildSeedBar(){
      const sb = document.getElementById('seedBar'); sb.innerHTML='';
      const order = ['peashooter','sunflower','wallnut','tallnut','snowpea','repeater','torchwood','squash','chomper','cherry','jalapeno','potatomine','spikeweed'];
      for (const id of order){ const def = PLANTS[id]; cardCooldown[id]=0; sb.appendChild(cardEl(def)); }

      function cardEl(def){
        const el=document.createElement('div'); el.className='card'; el.dataset.plant=def.id;
        el.innerHTML=`<div class="emoji">${def.emoji}</div><div><div class="title">${def.name}</div><div class="cost">${def.cost}</div></div><div class="badge">☀️不足</div><div class="cd" data-left=""></div>`;
        el.addEventListener('click', ()=>{
          selectedTool = { type:'plant', value:def.id };
          document.getElementById('shovelBtn').classList.remove('active');
          $all('.card').forEach(c=>c.classList.remove('active'));
          el.classList.add('active');
          ensureGhost(); updateGhostValidity();
        });
        return el;
      }

      const first = sb.querySelector('.card'); if (first) first.classList.add('active');
    }

    function updateCardsUI(){
      const now = performance.now();
      for (const el of $all('.card')){
        const id = el.dataset.plant; const def = PLANTS[id];
        const leftMs = Math.max(0, cardCooldown[id] - now);
        const affordable = sun >= def.cost;
        el.classList.toggle('cooling', leftMs > 0);
        el.classList.toggle('disabled', !affordable);
        const cd = el.querySelector('.cd'); cd.dataset.left = leftMs > 0 ? `${Math.ceil(leftMs/1000)}s` : '';
      }
    }

    // ---------------- 放置/移除 + 预览幽灵 ----------------
    function onTileEnter(e){ hoverCell = { row: Number(e.currentTarget.dataset.row), col: Number(e.currentTarget.dataset.col) }; ensureGhost(); positionGhost(); updateGhostValidity(); }
    function onTileLeave(){ hoverCell = null; if (ghostEl) ghostEl.classList.remove('show'); }

    function ensureGhost(){ if (selectedTool.type!=='plant') return; if (ghostEl) return; ghostEl = document.createElement('div'); ghostEl.className='ghost'; entitiesEl.appendChild(ghostEl); ghostEl.textContent = PLANTS[selectedTool.value]?.emoji || '🌿'; }
    function positionGhost(){ if (!ghostEl || !hoverCell) return; ghostEl.style.left = `${hoverCell.col*TILE_W}px`; ghostEl.style.top = `${hoverCell.row*TILE_H}px`; ghostEl.classList.add('show'); ghostEl.textContent = PLANTS[selectedTool.value]?.emoji || '🌿'; }
    function canPlace(id,row,col){ const def=PLANTS[id]; const now=performance.now(); if (!def) return false; if (cardCooldown[id]>now) return false; if (sun<def.cost) return false; if (grid[row][col]) return false; return true; }
    function updateGhostValidity(){ if (!ghostEl || !hoverCell || selectedTool.type!=='plant') return; const ok = canPlace(selectedTool.value, hoverCell.row, hoverCell.col); ghostEl.classList.toggle('valid', ok); ghostEl.classList.toggle('invalid', !ok); }

    function onTileClick(e){
      if (!running || paused) return;
      const row = Number(e.currentTarget.dataset.row); const col = Number(e.currentTarget.dataset.col);
      const existing = grid[row][col];
      if (selectedTool.type==='shovel'){ if (existing) removePlant(existing); return; }
      const id = selectedTool.value; if (!canPlace(id,row,col)) return; placePlant(id, row, col); updateGhostValidity(); }

    function placePlant(id,row,col){
      const def = PLANTS[id];
      sun -= def.cost; updateSunUI(); cardCooldown[id] = performance.now() + (def.cooldownMs ?? 5000);
      const plant = { id:`p_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, type:id, row, col, hp:def.hp, nextFireAt:0, nextSunAt:0, armedAt: (def.armTime? performance.now()+def.armTime: 0), chewUntil:0, triggered:false, el:null };
      plants.add(plant); grid[row][col]=plant;
      const el=document.createElement('div'); el.className = `plant ${def.className}`; el.style.left = `${col*TILE_W}px`; el.style.top = `${row*TILE_H}px`; el.textContent = def.emoji; el.title = `${def.name} HP:${plant.hp}`; entitiesEl.appendChild(el); plant.el=el;
      if (id==='cherry') { setTimeout(()=>explodeAt(row, col, def.radius, def.damage, plant), def.armedDelay); }
      if (id==='jalapeno') { setTimeout(()=>burnRow(row, plant), def.delay); }
    }

    function removePlant(plant){ plants.delete(plant); if (grid[plant.row][plant.col]===plant) grid[plant.row][plant.col]=null; plant.el?.remove(); }

    // ---------------- 僵尸波次 ----------------
    function spawnZombieWaveController(){
      const start = performance.now(); waveStartAt = start; bigWaveSpawned = false;
      if (skySunHandle) clearInterval(skySunHandle); skySunHandle = setInterval(spawnSkySun, LEVEL.skySunEvery);
      if (spawnHandle) clearInterval(spawnHandle);
      spawnHandle = setInterval(()=>{
        const t = performance.now() - start; const ratio = t / LEVEL.duration;
        if (!bigWaveSpawned && ratio >= LEVEL.bigWaveAt){
          bigWaveSpawned = true; spawnBigWave();
        }
        let pool = ['normal']; if (ratio > 0.15) pool.push('flag'); if (ratio > 0.25) pool.push('cone'); if (ratio > 0.45) pool.push('imp'); if (ratio > 0.6) pool.push('bucket'); if (ratio > 0.7) pool.push('screen'); if (ratio > 0.78) pool.push('pole'); if (ratio > 0.85) pool.push('football');
        const count = Math.random() < (ratio>0.6?0.4:0.18) ? 2 : 1;
        for (let i=0;i<count;i++) spawnZombie(randRow(), pick(pool));
        if (t >= LEVEL.duration){ clearInterval(spawnHandle); spawnHandle=null; }
      }, 2000);
    }

    function spawnBigWave(){
      for (let r=0;r<ROWS;r++){
        spawnZombie(r, 'flag');
        setTimeout(()=>spawnZombie(r, pick(['cone','bucket','screen','pole'])), 400);
        setTimeout(()=>spawnZombie(r, pick(['normal','imp','cone','pole'])), 900);
      }
    }

    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function randRow(){ return Math.floor(Math.random()*ROWS); }

    function spawnZombie(row, type){
      const def = ZOMBIES[type];
      const z = { id:`z_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, type, row, x: COLS*TILE_W + 10, hp:def.hp, shieldHp: def.shieldHp||0, attacking:false, targetPlant:null, slowedUntil:0, jumped:false, el:null };
      zombies.add(z);
      const el=document.createElement('div'); el.className = `zombie ${type}`; el.style.top = `${row*TILE_H + 5}px`; el.style.left = `${z.x}px`; el.textContent = def.emoji; if (type==='screen') el.classList.add('shielded'); entitiesEl.appendChild(el); z.el=el;
    }

    // ---------------- 弹丸 ----------------
    function fireProjectile(row, startX, type){
      const id = `pr_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
      const pr = { id, row, x:startX, startX, type, damage: type==='snow'? SNOWPEA.damage : PEA.damage, passedTorch:false, el:null };
      projectiles.add(pr);
      const el=document.createElement('div'); el.className = type==='snow' ? 'snowpea' : 'pea'; el.style.top = `${row*TILE_H + TILE_H/2 - 6}px`; el.style.left = `${startX}px`; entitiesEl.appendChild(el); pr.el=el;
    }

    function maybePassTorch(pr){
      if (pr.passedTorch) return;
      // if there is a torchwood between startX and current x on same row, convert
      for (const p of plants){
        if (p.type==='torchwood' && p.row===pr.row){
          const center = p.col*TILE_W + TILE_W/2;
          if (center > pr.startX && pr.x >= center){
            pr.passedTorch = true;
            pr.type = 'fire';
            pr.damage = FIREPEA.damage;
            pr.el.className = 'firepea';
            break;
          }
        }
      }
    }

    // ---------------- 阳光 ----------------
    function spawnSunToken(x,y, fromPlant=false){
      const token = { id:`s_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, x, y, vy: fromPlant? 0 : 40 + Math.random()*20, fromPlant, expireAt: performance.now() + (fromPlant? 6000: 9000), el:null };
      suns.add(token);
      const el=document.createElement('div'); el.className='sun-token'; el.style.left=`${x}px`; el.style.top=`${y}px`; el.textContent='+25'; el.style.pointerEvents='auto'; el.addEventListener('click', ()=>collectSun(token)); fieldEl.appendChild(el); token.el=el;
    }
    function collectSun(t){ if (!suns.has(t)) return; suns.delete(t); t.el?.remove(); sun+=25; updateSunUI(); }
    function spawnSkySun(){ const x = Math.random()*(COLS*TILE_W - 44); spawnSunToken(x, -10, false); }

    // ---------------- 割草机 ----------------
    function triggerMower(row){ const mower = Array.from(mowers).find(m=>m.row===row && !m.active); if (!mower) return false; mower.active=true; return true; }

    // ---------------- 伤害/爆炸/行火 ----------------
    function explodeAt(row, col, radius, damage, plantRef){
      const cx = col*TILE_W + TILE_W/2; const cy = row*TILE_H + TILE_H/2;
      const boom = document.createElement('div'); boom.className='boom'; boom.style.left = `${cx-70}px`; boom.style.top = `${cy-70}px`; entitiesEl.appendChild(boom); setTimeout(()=>boom.remove(), 300);
      for (const z of Array.from(zombies)){
        if (z.row!==row) continue; const zx = z.x + 30; const dx = Math.abs(zx - cx);
        if (dx <= radius){ damageZombie(z, damage, 'explosion'); }
      }
      if (plantRef) removePlant(plantRef);
    }

    function burnRow(row, plantRef){
      const y = row*TILE_H + TILE_H/2 - 35; const rf = document.createElement('div'); rf.className='rowfire'; rf.style.top = `${y}px`; entitiesEl.appendChild(rf); setTimeout(()=>rf.remove(), 600);
      for (const z of Array.from(zombies)){ if (z.row===row){ damageZombie(z, 9999, 'fire'); } }
      if (plantRef) removePlant(plantRef);
    }

    function damageZombie(z, amount, src){
      if (!z || !z.el) return;
      if (z.type==='screen' && z.shieldHp>0){
        z.shieldHp -= amount; if (z.shieldHp<=0){ z.shieldHp=0; z.el.classList.add('noshield'); }
        return;
      }
      z.hp -= amount;
      if (z.hp<=0){ z.el?.remove(); zombies.delete(z); }
    }

    // ---------------- 自适应缩放 ----------------
    function fitScale(){
      const fieldW = COLS*TILE_W; const fieldH = ROWS*TILE_H;
      const margin = 24;
      const topbar = document.querySelector('.topbar');
      const availW = Math.max(320, window.innerWidth - margin*2);
      const availH = Math.max(300, window.innerHeight - (topbar?.offsetHeight||0) - margin*2);
      const scale = Math.min(1, availW / fieldW, availH / fieldH);
      boardScaleEl.style.transform = `scale(${scale})`;
    }

    // ---------------- 主循环 ----------------
    function anyZombieAhead(row, col){ const xRight = (col+1)*TILE_W - 10; for (const z of zombies){ if (z.row===row && z.x >= xRight) return true; } return false; }

    function update(dt){
      const now = performance.now();
      // Plants behavior
      for (const p of Array.from(plants)){
        const def = PLANTS[p.type];
        if (p.type==='peashooter'){
          if (anyZombieAhead(p.row, p.col) && now>=p.nextFireAt){ p.nextFireAt = now + def.fireInterval; fireProjectile(p.row, p.col*TILE_W + (TILE_W-14), 'pea'); }
        } else if (p.type==='repeater'){
          if (anyZombieAhead(p.row, p.col) && now>=p.nextFireAt){ p.nextFireAt = now + def.fireInterval; const sx=p.col*TILE_W + (TILE_W-14); fireProjectile(p.row, sx, 'pea'); setTimeout(()=>fireProjectile(p.row, sx, 'pea'), 180); }
        } else if (p.type==='snowpea'){
          if (anyZombieAhead(p.row, p.col) && now>=p.nextFireAt){ p.nextFireAt = now + def.fireInterval; fireProjectile(p.row, p.col*TILE_W + (TILE_W-14), 'snow'); }
        } else if (p.type==='sunflower'){
          if (now>=p.nextSunAt){ p.nextSunAt = now + def.sunInterval; const x=p.col*TILE_W + (TILE_W/2 - 20); const y=p.row*TILE_H + (TILE_H/2 - 20); spawnSunToken(x,y,true); }
        } else if (p.type==='spikeweed'){
          const left = p.col*TILE_W; const right = left + TILE_W;
          for (const z of zombies){ if (z.row===p.row && z.x+30 >= left && z.x+30 <= right){ damageZombie(z, def.dps * dt, 'spike'); } }
        } else if (p.type==='potatomine'){
          if (now >= p.armedAt){ p.el.style.filter='saturate(1.1) brightness(1.1)'; const cx=p.col*TILE_W+TILE_W/2; for (const z of Array.from(zombies)){ if (z.row!==p.row) continue; const zx=z.x+30; if (Math.abs(zx-cx) < 30){ explodeAt(p.row, p.col, PLANTS.potatomine.radius, PLANTS.potatomine.damage, p); break; } } }
        } else if (p.type==='squash'){
          if (!p.triggered){
            // find closest zombie within reactRange ahead (including same tile)
            let target=null; let minDx=1e9; const px=p.col*TILE_W+TILE_W/2;
            for (const z of zombies){ if (z.row!==p.row) continue; const zx=z.x+30; const dx = Math.abs(zx-px); if (zx <= px + PLANTS.squash.reactRange && dx < minDx){ minDx=dx; target=z; } }
            if (target){
              p.triggered = true; p.el.style.transform = 'translate(5px, -10px) scale(1.1)'; setTimeout(()=>{ damageZombie(target, PLANTS.squash.damage, 'squash'); removePlant(p); }, 200);
            }
          }
        } else if (p.type==='chomper'){
          if (now < p.chewUntil) { p.el.style.opacity = 0.8; continue; } else { p.el.style.opacity = 1; }
          // find zombie in short range ahead
          const left = p.col*TILE_W; const front = left + TILE_W + PLANTS.chomper.range;
          let target=null; let minX=1e9; for (const z of zombies){ if (z.row!==p.row) continue; const zx=z.x+30; if (zx >= left && zx <= front && zx < minX){ minX=zx; target=z; } }
          if (target){ damageZombie(target, 9999, 'chomp'); p.chewUntil = now + PLANTS.chomper.chewMs; }
        }
        // torchwood, tallnut are passive
      }

      // Projectiles
      for (const pr of Array.from(projectiles)){
        // torchwood interaction
        maybePassTorch(pr);
        const spec = pr.type==='snow'? SNOWPEA : (pr.type==='fire'? FIREPEA : PEA);
        pr.x += spec.speed * dt; if (pr.x > COLS*TILE_W + 30){ projectiles.delete(pr); pr.el?.remove(); continue; }
        pr.el.style.left = `${pr.x}px`;
        for (const z of Array.from(zombies)){
          if (z.row !== pr.row) continue; const zx = z.x + 30; if (Math.abs(pr.x - zx) < 22){
            // fire pea removes slow
            if (pr.type==='fire'){ z.slowedUntil = 0; z.el.classList.remove('slowed'); }
            // apply to shield first if screen-door
            if (z.type==='screen' && z.shieldHp>0){ z.shieldHp -= pr.damage; if (z.shieldHp<=0){ z.shieldHp=0; z.el.classList.add('noshield'); } }
            else { z.hp -= pr.damage; }
            projectiles.delete(pr); pr.el?.remove(); if (z.hp<=0){ z.el?.remove(); zombies.delete(z);} break;
          }
        }
      }

      // Zombies
      for (const z of Array.from(zombies)){
        const def = ZOMBIES[z.type]; const isSlowed = (z.slowedUntil || 0) > now; if (!isSlowed) z.el.classList.remove('slowed');
        const baseSpeed = (z.type==='pole' && z.jumped) ? ZOMBIES.normal.speed : def.speed;
        const speed = baseSpeed * (isSlowed ? SNOWPEA.slowFactor : 1);
        if (!z.attacking){ if (z.x <= 6){ if (triggerMower(z.row)){} else { endGame(false); return; } } }

        if (!z.attacking){
          // detect plant in current tile
          const col = Math.max(0, Math.floor(z.x / TILE_W)); if (col>=0 && col<COLS){ const plant = grid[z.row][col]; if (plant && plant.type!=='spikeweed' && plant.type!=='cherry' && plant.type!=='potatomine' && plant.type!=='jalapeno'){
              // pole-vault special
              if (z.type==='pole' && !z.jumped){
                if (plant.type==='tallnut' && PLANTS.tallnut.blocksVault){ // blocked
                  z.attacking=true; z.targetPlant=plant;
                } else {
                  // jump over and slow down to walker speed
                  z.jumped = true; z.x = plant.col*TILE_W + TILE_W + 12; z.el.style.left = `${z.x}px`; // no damage to plant
                }
              } else { z.attacking=true; z.targetPlant=plant; }
          } }
        }

        if (!z.attacking){ z.x -= speed * dt; z.el.style.left = `${z.x}px`; }
        else { const target = z.targetPlant; if (!target || !plants.has(target)){ z.attacking=false; z.targetPlant=null; continue; } target.hp -= def.dps * dt; target.el.title = `${PLANTS[target.type].name} HP:${Math.max(0, target.hp|0)}`; if (target.hp <= 0){ removePlant(target); z.attacking=false; z.targetPlant=null; } }
      }

      // Mowers
      for (const m of Array.from(mowers)){
        if (!m.active) continue; m.x += 300*dt; m.el.style.left = `${m.x}px`; for (const z of Array.from(zombies)){ if (z.row===m.row && z.x < m.x + 50){ zombies.delete(z); z.el?.remove(); } } if (m.x > COLS*TILE_W + 80){ m.el?.remove(); mowers.delete(m); }
      }

      // Suns
      for (const s of Array.from(suns)){
        if (!s.fromPlant){ s.y += s.vy * dt; const maxY = ROWS*TILE_H - 52; if (s.y > maxY) s.y = maxY; s.el.style.top = `${s.y}px`; }
        if (now >= s.expireAt){ s.el?.remove(); suns.delete(s); }
      }

      // Progress
      const elapsed = now - waveStartAt; const ratio = Math.max(0, Math.min(1, elapsed/LEVEL.duration)); waveProgressEl.style.width = `${ratio*100}%`;
      if (elapsed >= LEVEL.duration && zombies.size===0 && running){ endGame(true); }
    }

    function loop(ts){ if (!running) return; const dt = Math.min(0.05, (ts-lastTs)/1000); lastTs = ts; if (!paused){ update(dt); } requestAnimationFrame(loop); }

    // ---------------- 胜负/控制 ----------------
    function endGame(win){ running=false; clearInterval(skySunHandle); skySunHandle=null; clearInterval(spawnHandle); spawnHandle=null; overlayTitleEl.textContent = win? '你赢了！' : '游戏结束'; overlayDescEl.textContent = win? '成功顶住了所有波次！' : '僵尸冲破了你的防线…'; overlayEl.hidden = false; overlayEl.style.pointerEvents = 'auto'; }

    function restart(){
      for (const p of Array.from(plants)) removePlant(p);
      for (const z of Array.from(zombies)) { z.el?.remove(); zombies.delete(z); }
      for (const pr of Array.from(projectiles)) { pr.el?.remove(); projectiles.delete(pr); }
      for (const s of Array.from(suns)) { s.el?.remove(); suns.delete(s); }
      for (const m of Array.from(mowers)) { m.el?.remove(); mowers.delete(m); }
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) grid[r][c]=null;

      sun = 150; updateSunUI(); running=true; paused=false; overlayEl.hidden=true; lastTs=performance.now();
      for (const id in PLANTS) { cardCooldown[id] = 0; }
      updateCardsUI();
      buildMowers();
      spawnZombieWaveController();
      requestAnimationFrame(loop);
      fitScale();
    }

    // ---------------- 事件/初始化 ----------------
    function setupToolbar(){
      document.getElementById('shovelBtn').addEventListener('click', ()=>{
        const btn = document.getElementById('shovelBtn');
        const active = btn.classList.toggle('active');
        selectedTool = active? {type:'shovel'} : { type:'plant', value:'peashooter' };
        $all('.card').forEach(c=>c.classList.remove('active'));
        if (ghostEl) { ghostEl.classList.remove('show'); }
      });
      document.getElementById('restartBtn').addEventListener('click', ()=>restart());
      document.getElementById('overlayRestart').addEventListener('click', ()=>restart());
      document.getElementById('pauseBtn').addEventListener('click', ()=>{ paused = !paused; document.getElementById('pauseBtn').textContent = paused? '▶️ 继续' : '⏸️ 暂停'; });
      window.addEventListener('resize', ()=>{ clearTimeout(window.__rsz); window.__rsz = setTimeout(fitScale, 100); });
    }

    function init(){ addStripeRows(); buildTiles(); buildSeedBar(); setupToolbar(); updateSunUI(); spawnSkySun(); restart(); }

    init();
  </script>
</body>
</html>
